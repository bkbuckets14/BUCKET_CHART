services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: bucket_chart_db
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data          # persistent data
      - ./db/init:/docker-entrypoint-initdb.d           # runs SQL on first boot
    ports:
      - "5432:5432"                                     # expose for local tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 60s
      timeout: 5s
      retries: 5

  # ── Ingestion Service ────────────────────────────────────────────────────────
  ingestion:
    build: ./ingestion
    container_name: bucket_chart_ingestion
    restart: "no"                                       # run once; use a scheduler for recurring jobs
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy                      # wait for DB to be ready
    volumes:
      - ./ingestion:/app                                # live-reload code during dev

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build: ./api
    container_name: bucket_chart_api
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app                                      # live-reload code during dev

  # ── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: bucket_chart_frontend
    restart: "no"
    ports:
      - "5173:5173"                                     # Vite default dev port
    volumes:
      - ./frontend:/app                                 # live-reload code during dev
      - /app/node_modules                               # keep node_modules in container
    depends_on:
      - api

  # ── pgAdmin (dev only — remove in production) ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bucket_chart_pgadmin
    restart: "no"
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
